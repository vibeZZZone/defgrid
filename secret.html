<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лонгрид</title>
  <link rel="icon" type="image/png" href="assets/photoo.png">
  <link rel="stylesheet" href="assets/style.css">

  <style>
    .secret-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .secret-page img {
      display: block;
      width: min(500px, 90vw);
      max-height: 70vh;
      object-fit: contain;
      margin-bottom: 25px;
    }

    .secret-page button {
      padding: 12px 22px;
      background: var(--lime);
      color: var(--paper);
      border: none;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
    }
  </style>
</head>
<body>
  <main class="secret-page">
    <img src="assets/photo8.jpg" alt="">

    <audio id="secretMusic" src="assets/music.mp3" autoplay loop></audio>

    <button id="playMusic">Включить музыку</button>
  </main>

  <script>
    const music = document.getElementById('secretMusic');
    const playButton = document.getElementById('playMusic');

    music.play()
      .then(() => {
        playButton.hidden = true;
      })
      .catch(() => {
        playButton.hidden = false;
      });

    playButton.addEventListener('click', () => {
      music.play().then(() => {
        playButton.hidden = true;
      }).catch(() => {
        playButton.textContent = 'Нажми ещё раз';
      });
    });
  </script>
</body>
</html>
